name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir
        run: unzip -q LauncherTV.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar
        run: gradle assembleDebug --no-daemon
        working-directory: LauncherTV
      - uses: actions/upload-artifact@v4
        with:
          name: LauncherTV-apk
          path: LauncherTV/app/build/outputs/apk/debug/app-debug.apk
